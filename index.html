function renderSeg(s){

let h=`<div class="seg" style="border-color:${s.color}">`;

if(s.tickets||s.links){
h+=`<div class="seg-links">`;
if(s.tickets)s.tickets.forEach(t=>{if(t.url)h+=`<a class="tkt" href="${t.url}" target="_blank">🎫 ${esc(t.label||'View Ticket')}</a>`});
if(s.links)s.links.forEach(l=>{
if(l.map)h+=`<a class="lnk" href="${map(l.map)}" target="_blank">📍 ${esc(l.label)}</a>`;
else if(l.href)h+=`<a class="lnk" href="${l.href}" target="_blank">🔗 ${esc(l.label)}</a>`;
});
h+=`</div>`}
h+=`</div>`;
return h;
}
function renderDays(){
const c=document.getElementById('days');
days.forEach((day,i)=>{
const parts=day.date.split(' ');
const el=document.createElement('div');
el.className='day';
el.innerHTML=`<button class="day-btn" onclick="this.parentElement.classList.toggle('open')">
<div class="day-date"><span class="m">${parts[0]}</span><span class="d">${parts[1]}</span></div>
<div class="day-info"><div class="day-title">${esc(day.title)}</div>${day.sub?`<div class="day-sub">${esc(day.sub)}</div>`:''}</div>
<span class="day-arrow">▼</span>
</button><div class="day-body">${day.segs.map(renderSeg).join('')}</div>`;
c.appendChild(el);
});
}
function renderRefs(){
const c=document.getElementById('refsBody');
refs.forEach(r=>{
c.innerHTML+=`<div class="ref-row"><div><div class="ref-label">${esc(r.l)}</div><div class="ref-code">${esc(r.r)}</div></div>${r.u?`<a class="ref-tkt" href="${r.u}" target="_blank">🎫</a>`:`<span style="font-size:12px;color:#556677">—</span>`}</div>`;
});
}
function toggleRefs(){
const b=document.getElementById('refsBody'),btn=document.getElementById('refsBtn'),a=document.getElementById('refsArrow');
const open=b.classList.toggle('open');
btn.classList.toggle('open',open);
a.textContent=open?'▲':'▼';
}
renderDays();
renderRefs();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
